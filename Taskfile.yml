# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

output: prefixed

tasks:
   default:
      cmds:
         - task: dev:all

   dev:all:
      desc: Run all services
      deps: [dev:gateway, dev:user, dev:project, dev:mail]

   dev:gateway:
      desc: API Gateway
      dir: ./gateway
      prefix: 'GATEWAY'
      cmds:
         - air -c .air.toml

   dev:user:
      desc: User Service
      dir: ./user-Service
      prefix: 'USER_SERVICE'
      cmds:
         - air -c .air.toml

   dev:project:
      desc: Project Service
      dir: ./project-service
      prefix: 'PROJECT_SERVICE'
      cmds:
         - air -c .air.toml

   dev:mail:
      desc: Mail Service
      dir: ./mail-service
      prefix: 'MAIL_SERVICE'
      cmds:
         - air -c .air.toml
