syntax = "proto3";
package logtheus.mail.v1;
option go_package = "logtheus/shared/pkg/pb/v1/mail";

import "google/protobuf/duration.proto";

message SuccessfulResponse {
  bool queued = 1;
}

// Provides emails sending service
service MailService {
  // Sends a verification email to the specified address.
  rpc SendVerifyEmail (SendVerifyEmailRequest) returns (SuccessfulResponse);

  // Sends a project invite email to the specified address.
  rpc SendInviteEmail (SendInviteEmailRequest) returns (SuccessfulResponse);

}

message SendVerifyEmailRequest {
  string                   username   = 1;
  string                   email      = 2;
  string                   code       = 3;
  google.protobuf.Duration expiration = 4;
}

message SendInviteEmailRequest {
  string inviter_name = 1;
  string project_name = 2;
  string email        = 3;
  string code         = 4;
}
