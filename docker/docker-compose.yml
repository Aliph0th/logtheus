name: logtheus
services:
   pg_user:
      image: postgres:17
      restart: unless-stopped
      container_name: logtheus_user_db
      environment:
         - POSTGRES_USER=${POSTGRES_USER_USER}
         - POSTGRES_PASSWORD=${POSTGRES_USER_PASSWORD}
         - POSTGRES_DATABASE=${POSTGRES_USER_DB}
      volumes:
         - logtheus_user_db:/var/lib/postgresql/data
      ports:
         - 5432:5432
      networks:
         - logtheus_net
   pg_project:
      image: postgres:17
      restart: unless-stopped
      container_name: logtheus_project_db
      environment:
         - POSTGRES_USER=${POSTGRES_PROJECT_USER}
         - POSTGRES_PASSWORD=${POSTGRES_PROJECT_PASSWORD}
         - POSTGRES_DATABASE=${POSTGRES_PROJECT_DB}
      volumes:
         - logtheus_project_db:/var/lib/postgresql/data
      ports:
         - 5433:5432
      networks:
         - logtheus_net
   redis:
      image: redis:7.2.7-alpine
      container_name: logtheus_user_redis
      restart: unless-stopped
      command: redis-server --requirepass ${REDIS_USER_PASSWORD}
      ports:
         - 6379:6379
      volumes:
         - logtheus_user_redis:/data
      networks:
         - logtheus_net
   clickhouse:
      image: clickhouse/clickhouse-server:26.2-alpine
      container_name: logtheus_logengine_clickhouse
      restart: unless-stopped
      environment:
         - CLICKHOUSE_DB=${CLICKHOUSE_LOGENGINE_DB}
         - CLICKHOUSE_USER=${CLICKHOUSE_LOGENGINE_USER}
         - CLICKHOUSE_PASSWORD=${CLICKHOUSE_LOGENGINE_PASSWORD}
         - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      ports:
         - 8123:8123
         - 9000:9000
      volumes:
         - logtheus_logengine_clickhouse:/var/lib/clickhouse
      ulimits:
         nofile:
            soft: 262144
            hard: 262144
      networks:
         - logtheus_net
volumes:
   logtheus_user_db:
   logtheus_project_db:
   logtheus_user_redis:
   logtheus_logengine_clickhouse:
networks:
   logtheus_net:
