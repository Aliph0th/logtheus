name: logtheus
services:
   pg_user:
      image: postgres:17
      restart: unless-stopped
      container_name: logtheus_user_db
      environment:
         - POSTGRES_USER=${POSTGRES_USER}
         - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
         - POSTGRES_DATABASE=${POSTGRES_DB}
      volumes:
         - logtheus_user_db:/var/lib/postgresql/data
      ports:
         - 5432:5432
      networks:
         - logtheus_net
   # redis:
   #    image: redis:7.2.7-alpine
