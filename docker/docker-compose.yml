   #    restart: unless-stopped
   #    command: redis-server --requirepass ${REDIS_PASSWORD}
   #    ports:
   #       - 6379:6379
   #    volumes:
   #       - redis_data:/data
   #    networks:
   #       - net
volumes:
   logtheus_user_db:
   # redis_data:
networks:
   logtheus_net:
