name: logtheus
services:
   pg_user:
      image: postgres:17
      restart: unless-stopped
      container_name: logtheus_user_db
      environment:
         - POSTGRES_USER=${POSTGRES_USER_USER}
         - POSTGRES_PASSWORD=${POSTGRES_USER_PASSWORD}
         - POSTGRES_DATABASE=${POSTGRES_USER_DB}
      volumes:
         - logtheus_user_db:/var/lib/postgresql/data
      ports:
         - 5432:5432
      networks:
         - logtheus_net
   pg_project:
      image: postgres:17
      restart: unless-stopped
      container_name: logtheus_project_db
      environment:
         - POSTGRES_USER=${POSTGRES_PROJECT_USER}
         - POSTGRES_PASSWORD=${POSTGRES_PROJECT_PASSWORD}
         - POSTGRES_DATABASE=${POSTGRES_PROJECT_DB}
      volumes:
         - logtheus_project_db:/var/lib/postgresql/data
      ports:
         - 5433:5432
      networks:
         - logtheus_net
   redis:
      image: redis:7.2.7-alpine
      container_name: logtheus_user_redis
      restart: unless-stopped
      command: redis-server --requirepass ${REDIS_USER_PASSWORD}
      ports:
         - 6379:6379
      volumes:
         - logtheus_user_redis:/data
      networks:
         - logtheus_net
   clickhouse:
      image: clickhouse/clickhouse-server:26.2-alpine
      container_name: logtheus_logengine_clickhouse
      restart: unless-stopped
      environment:
         - CLICKHOUSE_DB=${CLICKHOUSE_LOGENGINE_DB}
         - CLICKHOUSE_USER=${CLICKHOUSE_LOGENGINE_USER}
         - CLICKHOUSE_PASSWORD=${CLICKHOUSE_LOGENGINE_PASSWORD}
         - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      ports:
         - 8123:8123
         - 9000:9000
      volumes:
         - logtheus_logengine_clickhouse:/var/lib/clickhouse
      ulimits:
         nofile:
            soft: 262144
            hard: 262144
      networks:
         - logtheus_net
   kafka:
      image: bitnamilegacy/kafka:4.0.0
      container_name: logtheus_kafka
      restart: unless-stopped
      environment:
         - KAFKA_CFG_NODE_ID=1
         - KAFKA_CFG_PROCESS_ROLES=broker,controller
         - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093

         - KAFKA_CFG_LISTENERS=INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
         - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka:9092,EXTERNAL://localhost:9094

         - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
         - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
         - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL
         - KAFKA_CFG_SASL_ENABLED_MECHANISMS=PLAIN
         - KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL=PLAIN
         - KAFKA_CLIENT_USERS=${KAFKA_USERNAME}
         - KAFKA_CLIENT_PASSWORDS=${KAFKA_PASSWORD}
         - KAFKA_INTER_BROKER_USER=${KAFKA_USERNAME}
         - KAFKA_INTER_BROKER_PASSWORD=${KAFKA_PASSWORD}

         - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
         - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
         - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=1
         - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      ports:
         - 9092:9092
         - 9094:9094
      networks:
         - logtheus_net
      volumes:
         - logtheus_kafka_data:/bitnami/kafka
volumes:
   logtheus_user_db:
   logtheus_project_db:
   logtheus_user_redis:
   logtheus_logengine_clickhouse:
   logtheus_kafka_data:
networks:
   logtheus_net:
